<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robux Demo</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #ffffff;
    color: #303b52;
}

.demo {
    position: fixed;
    top: 12px;
    right: 15px;
    z-index: 10;
    background: #f1f3f5;
    border: 1px solid #d9dde3;
    padding: 7px 12px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: bold;
}

.nav {
    height: 76px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 5%;
    border-bottom: 1px solid #eeeeee;
}

.logo {
    font-size: 20px;
    font-weight: 700;
}

.navlinks {
    display: flex;
    gap: 45px;
    font-size: 15px;
}

.navright {
    display: flex;
    gap: 22px;
    align-items: center;
    font-size: 14px;
}

.container {
    max-width: 1100px;
    margin: auto;
    padding: 55px 25px;
}

.balance {
    font-size: 32px;
    font-weight: 700;
    margin-bottom: 65px;
}

.hero {
    text-align: center;
}

.hero h1 {
    font-size: 52px;
    line-height: 1.1;
    margin: 0 auto 30px;
    max-width: 700px;
}

.hero p {
    color: #687287;
    font-size: 16px;
}

.card {
    max-width: 500px;
    margin: 45px auto;
    padding: 28px;
    border: 1px solid #e1e4e8;
    border-radius: 14px;
    background: white;
    box-shadow: 0 4px 20px rgba(0,0,0,0.04);
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #d7dce2;
    border-radius: 8px;
    font-size: 15px;
    margin-bottom: 12px;
    outline: none;
}

input:focus {
    border-color: #5865f2;
}

button {
    width: 100%;
    padding: 15px;
    border: 0;
    border-radius: 8px;
    background: #303b52;
    color: white;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

button:hover {
    opacity: .9;
}

.profile {
    display: none;
    text-align: center;
    margin-top: 25px;
}

.profile img {
    width: 100px;
    height: 100px;
    border-radius: 12px;
    object-fit: cover;
}

.username {
    font-size: 22px;
    font-weight: bold;
    margin-top: 12px;
}

.userid {
    color: #7b8494;
    font-size: 13px;
    margin: 5px 0 20px;
}

.amount {
    margin-top: 20px;
}

.result {
    display: none;
    text-align: center;
    padding: 25px;
    margin-top: 20px;
    border-radius: 10px;
    background: #f5f6f8;
}

.section {
    margin-top: 90px;
}

.section-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 30px;
}

@media(max-width:700px) {
    .navlinks {
        display: none;
    }

    .hero h1 {
        font-size: 38px;
    }

    .balance {
        font-size: 26px;
    }
}
</style>
</head>

<body>

<div class="demo">DEMO ONLY</div>

<nav class="nav">
    <div class="logo">Robux</div>

    <div class="navlinks">
        <span>Charts</span>
        <span>Marketplace</span>
        <span>Create</span>
    </div>

    <div class="navright">
        <span>Search</span>
        <span>⚙</span>
    </div>
</nav>

<main class="container">

    <div class="balance">
        ◈ 10,000
    </div>

    <section class="hero">
        <h1>Enjoy up to 25% more Robux</h1>
        <p>Robux transfer simulator using public Roblox profile information.</p>
    </section>

    <div class="card">

        <h2>Send Robux</h2>

        <input id="username" type="text" placeholder="Enter Roblox username">

        <input id="amount" type="number" placeholder="Robux amount">

        <button onclick="findUser()">Find User</button>

        <div id="profile" class="profile">

            <img id="avatar" src="" alt="Roblox avatar">

            <div id="displayName" class="username"></div>

            <div id="userId" class="userid"></div>

            <button onclick="sendDemo()">Send Robux</button>

        </div>

        <div id="result" class="result"></div>

    </div>

    <section class="section">

        <div class="section-title">
            <strong>Limited-time avatar items</strong>
            <span>12 days left</span>
        </div>

    </section>

</main>

<script>
let selectedUser = null;

async function findUser() {

    const username = document.getElementById("username").value.trim();

    if (!username) {
        alert("Enter a Roblox username.");
        return;
    }

    try {

        const response = await fetch(
            "https://users.roblox.com/v1/usernames/users",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    usernames: [username],
                    excludeBannedUsers: false
                })
            }
        );

        const data = await response.json();

        if (!data.data || data.data.length === 0) {
            alert("Roblox user not found.");
            return;
        }

        selectedUser = data.data[0];

        document.getElementById("displayName").textContent =
            selectedUser.displayName;

        document.getElementById("userId").textContent =
            "@" + selectedUser.name + " • ID " + selectedUser.id;

        const avatarResponse = await fetch(
            "https://thumbnails.roblox.com/v1/users/avatar-headshot?userIds=" +
            selectedUser.id +
            "&size=150x150&format=Png&isCircular=false"
        );

        const avatarData = await avatarResponse.json();

        if (avatarData.data && avatarData.data.length > 0) {
            document.getElementById("avatar").src =
                avatarData.data[0].imageUrl;
        }

        document.getElementById("profile").style.display = "block";

    } catch (error) {

        alert("Unable to connect to Roblox public services.");

    }
}

function sendDemo() {

    if (!selectedUser) {
        return;
    }

    const amount = document.getElementById("amount").value;

    if (!amount || amount <= 0) {
        alert("Enter a Robux amount.");
        return;
    }

    const result = document.getElementById("result");

    result.style.display = "block";
    result.innerHTML = "Processing demo transfer...";

    setTimeout(function() {

        result.innerHTML =
            "<strong>Demo transfer complete</strong><br><br>" +
            amount + " Robux simulated for " +
            selectedUser.displayName +
            ".<br><br>" +
            "No real Robux was transferred.";

    }, 2000);
}
</script>

</body>
</html>
